name: Build IPA

# Build, publish an installable IPA, then update this fork's AltStore source.
# The source is never updated until the public release asset is available.

on:
  push:
    branches: [main]
    paths-ignore:
      - "source/**"
      - ".github/workflows/last-dragonrider.yml"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opaline-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags for version computation, full history for build number

      - name: Check source publisher
        run: python3 -m unittest discover -s scripts -p 'test_update_source.py'

      - name: Check uTube links
        run: bash scripts/check_youtube_link_parser.sh

      - name: Check native comments and AirPlay policies
        run: |
          swiftc Opaline/Core/API/Models/Comment.swift \
            Opaline/Core/Commenting/CommentAPIModel.swift \
            Opaline/Core/Commenting/CommentOAuthRequest.swift \
            Opaline/Core/Commenting/CommentDraftStore.swift \
            Opaline/Core/Commenting/YouTubeCommentSession.swift \
            Opaline/Core/Commenting/YouTubeCommentModel.swift \
            Opaline/Core/Playback/PlaybackInterruptionState.swift \
            Opaline/Core/Playback/BackgroundPlaybackPolicy.swift \
            scripts/native_comments_checks.swift -o "$RUNNER_TEMP/native-comments-checks"
          "$RUNNER_TEMP/native-comments-checks"

      - name: Check YouTube notifications
        run: |
          swiftc Opaline/Core/API/Models/Comment.swift \
            Opaline/Core/Commenting/CommentAPIModel.swift \
            Opaline/Core/Commenting/CommentOAuthRequest.swift \
            Opaline/Core/Commenting/YouTubeCommentModel.swift \
            Opaline/Core/Common/YouTubeLinkParser.swift \
            Opaline/Core/Notifications/YouTubeNotification.swift \
            Opaline/Core/Notifications/YouTubeNotificationDestination.swift \
            Opaline/Core/Notifications/YouTubeNotificationModel.swift \
            Opaline/Core/Notifications/NotificationReplyTarget.swift \
            Opaline/Core/Notifications/NotificationThreadPage.swift \
            Opaline/Core/API/InnertubeClient+CommentParsing.swift \
            Opaline/Core/API/InnertubeClient+CommentBuilding.swift \
            Opaline/Features/Home/HomePreviewPolicy.swift \
            scripts/youtube_notifications_checks.swift -o "$RUNNER_TEMP/youtube-notifications-checks"
          "$RUNNER_TEMP/youtube-notifications-checks"

      # The SwiftLint build phase runs --strict, so a newer linter on the image
      # can fail the build with rules the project has never seen; pin the
      # project's version. Xcode stays the image default: non-default Xcodes
      # on the runner have no iOS platform installed, and downloading it per
      # run costs gigabytes.
      - name: Pin SwiftLint 0.63.3
        run: |
          curl -sL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.63.3/portable_swiftlint.zip
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install -m 755 "$RUNNER_TEMP/swiftlint/swiftlint" "$(brew --prefix)/bin/swiftlint"
          swiftlint version

      # make_ipa.sh signs with ldid instead of codesign (issue #32). The runner
      # image ships homebrew-core's ldid, which has no -S flag.
      - name: Install ldid-procursus
        run: |
          brew unlink ldid 2>/dev/null || true
          brew install ldid-procursus
          ldid 2>&1 | head -1

      - name: Configure local build settings
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          # Point the update-notification check at this repository's own
          # feed, so a fork ships with its own without editing anything.
          # `//` starts a comment in xcconfig — hence the `$()` splits.
          sed -i '' '/^APP_MANIFEST_URL/d' Config/Local.xcconfig
          if [ "${GITHUB_REPOSITORY%%/*}" = "verback2308" ]; then
            # Upstream polls its own domain: the URL is baked into every
            # shipped binary and can never be changed afterwards, so it must
            # survive a repo rename or a move off GitHub. Matched on the owner,
            # not the full name, so it keeps holding after a rename.
            #
            # Builds up to 1.7.x carry a custom domain that is now retired --
            # they keep polling a host that stops answering and can never be
            # told otherwise. That break is one-off; it must not happen twice,
            # so this URL is now frozen, and with it the name of the repository
            # it points into.
            printf 'APP_MANIFEST_URL = https:/$()/verback2308.github.io/repo/apps.json\n' \
              >> Config/Local.xcconfig
          else
            printf 'APP_MANIFEST_URL = https:/$()/raw.githubusercontent.com/%s/main/source/apps.json\n' \
              "$GITHUB_REPOSITORY" >> Config/Local.xcconfig
          fi
          cat Config/Local.xcconfig

      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force --quiet
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' \
            Opaline.xcodeproj/project.pbxproj | head -1)
          MAJOR_MINOR=$(echo "$MARKETING" | cut -d. -f1,2)
          PATCH=$(echo "$MARKETING" | cut -d. -f3)
          PATCH=${PATCH:-0}
          VERSION="$MAJOR_MINOR.$PATCH"
          # MARKETING_VERSION is a floor: while its tag is already released,
          # bump the patch. Drafts don't create tags, so a pending draft is
          # simply replaced by the next build instead of burning a version.
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR_MINOR.$PATCH"
          done
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD (project has $MARKETING)"

      - name: Build IPA
        env:
          IPA_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          UPDATE_SOURCE: "0"
          XCODEBUILD_EXTRA_ARGS: CODE_SIGNING_ALLOWED=NO
        run: ./make_ipa.sh

      - name: Build Cydia/Sileo debs
        run: ./make_deb.sh

      - name: Check standalone app identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/check_utube_identity.py --check-signatures "uTube_${VERSION}.ipa" "uTube_${VERSION}_iphoneos-arm.deb" "uTube_${VERSION}_iphoneos-arm64.deb"

      - name: Publish release and AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Replace a stale draft for the same version, if any
          # (published releases have tags, so they never match here).
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done
          gh release create "$VERSION" \
            "uTube_${VERSION}.ipa" \
            "uTube_${VERSION}_iphoneos-arm.deb" \
            "uTube_${VERSION}_iphoneos-arm64.deb" \
            --draft \
            --title "uTube $VERSION — kharrison" \
            --notes-file source/release-notes.md \
            --target "$GITHUB_SHA"
          gh release edit "$VERSION" --draft=false --latest

          IPA="uTube_${VERSION}.ipa"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${IPA}"
          curl --fail --location --head --retry 5 --retry-all-errors --retry-delay 3 "$URL"
          SIZE=$(stat -f%z "$IPA")
          DATE=$(gh release view "$VERSION" --json publishedAt --jq .publishedAt)
          # A release published with GITHUB_TOKEN does not trigger another
          # workflow. Update the feed here rather than relying on that event.
          git pull --rebase origin main
          python3 scripts/update_source.py \
            --version "$VERSION" \
            --download-url "$URL" \
            --size "$SIZE" \
            --date "$DATE" \
            --ipa "$IPA" \
            --replace-bundle-id com.verback.YTLite \
            --notes-file source/release-notes.md \
            --release-title "uTube $VERSION — kharrison"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/apps.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AltStore source to $VERSION [skip ci]"
            git push origin HEAD:main
          fi
          echo "Install source: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/source/apps.json"
