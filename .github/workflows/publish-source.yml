name: Publish AltStore source

# Fires when a release is published (including a draft flipping to published).
# Only at that point is the IPA download URL live, so only now may
# source/apps.json — served raw from main — start advertising the version.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: opaline-release
  cancel-in-progress: false

jobs:
  update-source:
    if: ${{ !startsWith(github.event.release.tag_name, 'ldr-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update apps.json from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          RELEASE_TITLE: ${{ github.event.release.name }}
        run: |
          ASSET=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name | endswith(".ipa")) | "\(.browser_download_url) \(.size)"' \
            | head -1)
          if [ -z "$ASSET" ]; then
            echo "Release $TAG has no IPA asset — nothing to publish"
            exit 1
          fi
          URL=${ASSET% *}
          SIZE=${ASSET##* }
          IPA_DIR="$RUNNER_TEMP/source-ipa"
          mkdir -p "$IPA_DIR"
          gh release download "$TAG" --pattern '*.ipa' --dir "$IPA_DIR" --clobber
          IPA=$(find "$IPA_DIR" -maxdepth 1 -name '*.ipa' -print -quit)
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            --jq '.body // ""' > "$NOTES_FILE"
          python3 scripts/update_source.py \
            --version "$TAG" \
            --download-url "$URL" \
            --size "$SIZE" \
            --date "$PUBLISHED_AT" \
            --ipa "$IPA" \
            --replace-bundle-id com.verback.YTLite \
            --notes-file "$NOTES_FILE" \
            --release-title "$RELEASE_TITLE"

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/apps.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update source to $TAG [skip ci]"
          git push
