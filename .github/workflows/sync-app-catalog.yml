name: Sync kharrison Apps catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

# Share the source writer lock with the existing uTube release publisher.
concurrency:
  group: opaline-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Test catalog merge and recovery
        run: python3 -m unittest discover -s source/catalog -p 'test_sync.py'
      - name: Import published Verse and Quill listings
        run: python3 source/catalog/sync.py
      - name: Publish catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/apps.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync independently published apps into kharrison Apps [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
